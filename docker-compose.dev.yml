services:
  user-management:
    build:
      context: ./backend/user-management
      target: dev-runtime
    image: ghcr.io/hamzabouazizi/user-management:dev
    ports:
      - "8080:8080"
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_NEO4J_URI: ${NEO4J_BOLT_INTERNAL}
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USERNAME}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_DEVTOOLS_REMOTE_SECRET: ${SPRING_DEVTOOLS_REMOTE_SECRET}
    volumes:
      - ./backend/user-management/src:/app/src:rw
      - ./backend/user-management/pom.xml:/app/pom.xml:rw
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1" ]
      interval: 10s
      retries: 30
      start_period: 180s
      timeout: 30s
    depends_on:
      neo4j:
        condition: service_healthy

  user-management-test:
    build:
      context: ./backend/user-management
      target: test
    profiles: [ "test" ]
    image: ghcr.io/hamzabouazizi/user-management:test
    environment:
      JWT_SECRET: ${JWT_SECRET}
      SPRING_NEO4J_URI: ${NEO4J_BOLT_INTERNAL}
      SPRING_NEO4J_AUTHENTICATION_USERNAME: ${NEO4J_USERNAME}
      SPRING_NEO4J_AUTHENTICATION_PASSWORD: ${NEO4J_PASSWORD}
      SPRING_DEVTOOLS_REMOTE_SECRET: ${SPRING_DEVTOOLS_REMOTE_SECRET}
    depends_on:
      neo4j:
        condition: service_healthy

  pdf-graphrag-service:
    build:
      context: ./backend/pdf-graphrag-service
      target: dev
    image: ghcr.io/hamzabouazizi/pdf-graphrag-service:dev
    volumes:
      - ./backend/pdf-graphrag-service/src:/app/src
      - "${PDF_STORAGE_DIR}:/app/storage/pdfs"
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=${NEO4J_BOLT_INTERNAL}
      - NEO4J_USER=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - USER_MGMT_URL=${USER_MGMT_URL}
      - LOG_LEVEL=debug
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8000/health/liveness || exit 1" ]
      interval: 10s
      retries: 30
      start_period: 120s
      timeout: 30s
    depends_on:
      user-management:
        condition: service_healthy
      neo4j:
        condition: service_healthy

  chat-service:
    build:
      context: ./backend/chat-service
      target: dev
    image: ghcr.io/hamzabouazizi/chat-service:dev
    volumes:
      - ./backend/chat-service/src:/app/src
    ports:
      - "8001:8001"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEO4J_URI=${NEO4J_BOLT_INTERNAL}
      - NEO4J_USER=${NEO4J_USERNAME}
      - NEO4J_PASSWORD=${NEO4J_PASSWORD}
      - USER_MGMT_URL=${USER_MGMT_URL}
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8001/health/liveness || exit 1" ]
      interval: 10s
      retries: 30
      start_period: 120s
      timeout: 30s
    depends_on:
      - user-management
      - neo4j

  graphrag-frontend:
    build:
      context: .
      dockerfile: graphrag-frontend/Dockerfile
      target: dev
    image: ghcr.io/hamzabouazizi/graphrag-frontend:dev
    volumes:
      - ./graphrag-frontend:/app:cached
      - frontend_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=3000
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    ports:
      - "3000:3000"

  neo4j:
    image: neo4j:latest
    environment:
      - NEO4J_AUTH=${NEO4J_USERNAME}/${NEO4J_PASSWORD}
    volumes:
      - "${NEO4J_DATA_DIR}:/data"
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: [ "CMD", "cypher-shell", "-u", "${NEO4J_USERNAME}", "-p", "${NEO4J_PASSWORD}", "RETURN 1;" ]
      interval: 10s
      timeout: 30s
      retries: 30
      start_period: 180s

volumes:
  frontend_node_modules:


